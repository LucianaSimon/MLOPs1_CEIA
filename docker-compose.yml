services:
  postgres:
      restart: always
      build:
        context: ./Dockerfiles
        dockerfile: postgres/Dockerfile
      image: postgres_system
      container_name: postgres
      ports:
        - "5432:5432"
      #networks:
      #  - backend
      environment:
        - POSTGRES_DB=mlops_ceia
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
      #volumes:
      #  - db_data:/var/lib/postgresql/data
      # -h localhost: durante la carga de bronze (initdb) Postgres solo escucha por socket,
      # así que el healthcheck recién pasa cuando los scripts de init terminaron
      healthcheck:
        test: ["CMD", "pg_isready", "-h", "localhost", "-U", "postgres", "-d", "mlops_ceia"]
        interval: 5s
        timeout: 5s
        retries: 20

  trainer:
      build:
        context: .
        dockerfile: Dockerfiles/trainer/Dockerfile
      image: trainer_system
      container_name: trainer
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        - POSTGRES_HOST=postgres
        - POSTGRES_PORT=5432
        - POSTGRES_DB=mlops_ceia
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - ARTIFACTS_DIR=/artifacts
      volumes:
        - ./artifacts:/artifacts